<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MyCalorie">
<meta name="theme-color" content="#F3F6F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1412" media="(prefers-color-scheme: dark)">
<title>MyCalorie</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root{
  --bg:#F3F6F4;--surface:#FFFFFF;--surface2:#E8EFEB;--ink:#15201C;--muted:#5C6B65;--line:#DCE4E0;
  --accent:#0B7A63;--accent-ink:#FFFFFF;--accent-soft:#D5EEE6;
  --carb:#C98A1B;--prot:#4B5FD1;--fat:#CC5B4F;--water:#2F86C8;--warn:#C2410C;
  --shadow:0 1px 2px rgba(20,40,32,.05),0 6px 18px rgba(20,40,32,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1412;--surface:#17201D;--surface2:#212C28;--ink:#E4EDE9;--muted:#93A39C;--line:#2A3632;
    --accent:#35C39F;--accent-ink:#05231B;--accent-soft:#163A30;
    --carb:#E2A53B;--prot:#8A9AF2;--fat:#EE8074;--water:#6DB3EA;--warn:#FB923C;
    --shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1412;--surface:#17201D;--surface2:#212C28;--ink:#E4EDE9;--muted:#93A39C;--line:#2A3632;
  --accent:#35C39F;--accent-ink:#05231B;--accent-soft:#163A30;
  --carb:#E2A53B;--prot:#8A9AF2;--fat:#EE8074;--water:#6DB3EA;--warn:#FB923C;
  --shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.big,.en-kcal,.m-val,.r-sub,.live,.sub,svg text{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance}

/* top bar */
.top{position:sticky;top:0;z-index:10;background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:calc(env(safe-area-inset-top,0px) + 6px) 16px 6px}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;min-height:44px}
.mark{display:flex;align-items:center;gap:7px;font-weight:700;letter-spacing:-.01em;font-size:16px;margin-right:auto}
.mark svg{width:22px;height:22px}
.daynav{display:flex;align-items:center;gap:2px}
.navbtn{width:36px;height:36px;border-radius:50%;border:0;background:transparent;font-size:22px;color:var(--muted)}
.daybtn{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:7px 14px;font-weight:600;min-width:112px}
.top h1{font-size:17px;margin:0}

/* layout */
.wrap{max-width:560px;margin:0 auto;padding:4px 16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow)}

/* summary */
.summary{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;row-gap:16px}
.sum-side{display:flex;flex-direction:column;align-items:center;gap:2px}
.sum-side .num{font-size:20px;font-weight:650}
.lbl{font-size:12px;color:var(--muted)}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring-bg{stroke:var(--surface2)}
.ring-fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring-fg.over{stroke:var(--warn)}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.macros{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.macro{display:flex;flex-direction:column;gap:5px}
.m-lbl{font-size:12px;color:var(--muted);font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;transition:width .6s ease}
.m-c{background:var(--carb)}.m-p{background:var(--prot)}.m-f{background:var(--fat)}
.m-val{font-size:12px;color:var(--muted)}

/* meals */
.meal header,.water header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.meal h2,.water h2{font-size:16px;margin:0;font-weight:650}
.sub{font-size:13px;color:var(--muted)}
.add{width:38px;height:38px;flex:none;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent);font-size:24px;line-height:1;font-weight:500;display:grid;place-items:center}
.add.ghost{background:var(--surface2);color:var(--ink)}
.entries{list-style:none;margin:10px 0 0;padding:0}
.entries li{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:9px 0}
.entry{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;display:flex;flex-direction:column}
.en-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:550}
.en-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.en-kcal{font-weight:650;font-size:14px}
.del{width:30px;height:30px;border-radius:50%;border:0;background:none;color:var(--muted);font-size:20px;flex:none}
.wbtns{display:flex;gap:8px}
.glasses{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.glass{width:20px;height:27px;border:2px solid var(--line);border-radius:3px 3px 7px 7px;transition:background .2s}
.glass.on{background:var(--water);border-color:var(--water)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.navtab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;color:var(--muted);font-size:11px;font-weight:600}
.navtab svg{width:24px;height:24px}
.navtab.on{color:var(--accent)}

/* sheet */
#sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet-head{position:sticky;top:0;z-index:3;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 0}
.sh-in{max-width:560px;margin:0 auto}
.sh-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.sh-row h2{margin:0;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#mealSel{width:auto;padding:6px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:650;font-size:16px;border:0}
.closebtn{border:0;background:none;color:var(--accent);font-weight:650;padding:8px 4px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:10px 11px;color:var(--muted);font-weight:650;border-bottom:2.5px solid transparent;font-size:14px}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
#sheetBody{padding-top:12px}

/* controls */
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:550}
textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface2);border:1px solid transparent;border-radius:10px;padding:10px 12px;width:100%;resize:vertical}
textarea:focus{outline:2px solid var(--accent);outline-offset:0}
input,select{background:var(--surface2);border:1px solid transparent;border-radius:10px;padding:10px 12px;font-size:16px;color:var(--ink);width:100%;min-width:0}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0}
.form,.amt{display:flex;flex-direction:column;gap:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:420px){.row4{grid-template-columns:1fr 1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:650;font-size:15px;min-height:44px;color:var(--ink);text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--warn)}
.btn.wide{width:100%}
.btn.small{min-height:34px;padding:6px 10px;font-size:13px;border-radius:10px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.searchrow{display:flex;gap:8px}
.searchrow input{flex:1}
.searchrow .btn{flex:none}
.sec{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 4px 8px;font-weight:650}
.results{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.results>li{border-bottom:1px solid var(--line)}
.results>li:last-child{border-bottom:0}
.result{width:100%;text-align:left;background:none;border:0;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.r-name{font-weight:600}
.r-sub{font-size:13px;color:var(--muted)}
.hint{margin:0 0 12px;color:var(--muted);font-size:14px}
.note{background:var(--accent-soft);padding:10px 12px;border-radius:12px;margin:0;font-size:14px}
.status{font-size:14px;color:var(--muted);margin:10px 4px 0}
.status:empty{display:none}
.status.err{color:var(--warn)}
.empty{color:var(--muted);font-size:14px;margin:4px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:650;padding:12px 4px;text-align:left;font-size:15px}
.scanbox{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%;margin-bottom:12px}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.reticle{position:absolute;left:10%;right:10%;top:36%;bottom:36%;border:2px solid rgba(255,255,255,.9);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
.amt-name{margin:0;font-size:19px}
.per{margin:0;font-size:13px;color:var(--muted)}
.amtrow{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600}
.live{display:flex;gap:16px;flex-wrap:wrap;align-items:baseline;padding:12px 14px;background:var(--surface2);border-radius:12px;font-size:14px;color:var(--muted)}
.live b{font-size:20px;color:var(--ink)}
.check{flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
details summary{cursor:pointer;color:var(--muted);font-size:13px;padding:10px 4px}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px;background:var(--surface2);padding:10px;border-radius:10px;max-height:260px;overflow:auto;margin:0}
.rc{display:flex;gap:8px;align-items:center;padding:10px 12px}
.rc-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rc-name{padding:7px 9px;font-size:15px}
.rc-act{display:flex;gap:6px;align-items:center;flex:none}
.rc.done{opacity:.55}
.okmark{color:var(--accent);font-weight:700;padding:0 8px}
.iconbtn{background:none;border:0;color:var(--muted);font-size:20px;width:32px;height:34px}

/* progress + settings */
.kpis{display:flex;gap:24px;margin:4px 0 10px}
.kpi{display:flex;flex-direction:column}
.kpi .num{font-size:22px;font-weight:700}
.card h2{font-size:16px;margin:0 0 8px;font-weight:650}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px}
.wlist{list-style:none;margin:10px 0 0;padding:0}
.wlist li{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:6px 0;font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.calcout{background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:14px}
.calcout b{font-size:17px}
.small{font-size:13px;color:var(--muted);margin:0}
.foodlist{list-style:none;margin:8px 0 0;padding:0}
.foodlist li{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding:6px 0;font-size:14px}
.foodlist span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;margin:0 auto;max-width:420px;background:var(--ink);color:var(--bg);border-radius:12px;padding:11px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#toast button{background:none;border:0;color:var(--accent-soft);font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="var(--surface2)" stroke-width="3.2"/><circle cx="12" cy="12" r="9" fill="none" stroke="var(--accent)" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="45.2 56.5" transform="rotate(-90 12 12)"/></svg><span id="topTitle">MyCalorie</span></div>
    <div class="daynav" id="daynav">
      <button class="navbtn" data-act="prevday" aria-label="Previous day">‹</button>
      <button class="daybtn" data-act="today" id="dayLabel">Today</button>
      <button class="navbtn" data-act="nextday" aria-label="Next day">›</button>
    </div>
  </div>
</header>

<main>
  <div class="wrap" id="view-diary"></div>
  <div class="wrap" id="view-progress" hidden></div>
  <div class="wrap" id="view-settings" hidden></div>
</main>

<nav class="tabbar" aria-label="Sections">
  <div class="tabbar-in">
    <button class="navtab on" data-act="view" data-v="diary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="7.5"/><circle cx="12" cy="13" r="3.5"/><path d="M5 3v4M19 3v4"/></svg>Diary</button>
    <button class="navtab" data-act="view" data-v="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19h16"/><path d="M5 15l4-5 4 3 6-7"/></svg>Progress</button>
    <button class="navtab" data-act="view" data-v="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</button>
  </div>
</nav>

<div id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-head"><div class="sh-in">
    <div class="sh-row">
      <h2 id="sheetTitle">Add to <select id="mealSel" aria-label="Meal"><option value="breakfast">Breakfast</option><option value="lunch">Lunch</option><option value="dinner">Dinner</option><option value="snack">Snacks</option></select></h2>
      <button class="closebtn" data-act="close">Close</button>
    </div>
    <div class="tabs" id="sheetTabs"></div>
  </div></div>
  <div class="wrap" id="sheetBody"></div>
</div>

<div id="toast" hidden role="status"></div>

<script>
'use strict';
/* ---------- basics ---------- */
const $=s=>document.querySelector(s);
const P=()=>$('#sheetBody');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const r0=n=>Math.round(n||0);
const r1=n=>Math.round((n||0)*10)/10;
const num=v=>{const x=parseFloat(v);return Number.isFinite(x)?x:null};
const fmt=n=>r0(n).toLocaleString();
const KEY='mycalorie.v1';
const MEALS=[['breakfast','Breakfast'],['lunch','Lunch'],['dinner','Dinner'],['snack','Snacks']];
const mealName=m=>(MEALS.find(x=>x[0]===m)||MEALS[0])[1];
const OFF='https://world.openfoodfacts.org';
const OFF_FIELDS='code,product_name,product_name_ja,product_name_en,brands,nutriments,serving_quantity';
const TESS_URL='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
const ZX_URL='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
const DEFAULTS={goal:2000,macro:{p:25,c:50,f:25},waterGoal:8,ocrLang:'eng+jpn',
  profile:{sex:'m',age:30,height:170,weight:70,activity:1.375,pace:0}};

/* ---------- storage (only on this device) ---------- */
function blank(){return{settings:JSON.parse(JSON.stringify(DEFAULTS)),foods:[],log:{},weights:[],water:{}}}
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){
      const d=JSON.parse(raw),s=d.settings||{};
      return{settings:{...DEFAULTS,...s,macro:{...DEFAULTS.macro,...(s.macro||{})},profile:{...DEFAULTS.profile,...(s.profile||{})}},
        foods:d.foods||[],log:d.log||{},weights:d.weights||[],water:d.water||{}};
    }
  }catch(e){}
  return blank();
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(db));return true}
  catch(e){toast('Could not save. Storage may be full or blocked.');return false}
}
let db=load();

/* ---------- dates ---------- */
const dkey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fromKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
let cur=dkey(new Date());
function dayLabel(k){
  const y=new Date();y.setDate(y.getDate()-1);
  if(k===dkey(new Date()))return'Today';
  if(k===dkey(y))return'Yesterday';
  return fromKey(k).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
}
function shiftDay(n){const d=fromKey(cur);d.setDate(d.getDate()+n);cur=dkey(d);renderDiary()}

/* ---------- nutrition math ---------- */
function factor(e){
  const f=e.food;
  if(f.basis==='100g'){const g=e.unit==='g'?e.amount:e.amount*(f.servingG||100);return g/100}
  return e.unit==='serving'?e.amount:(f.servingG?e.amount/f.servingG:e.amount);
}
function nut(e){const k=factor(e),f=e.food;return{kcal:(f.kcal||0)*k,p:(f.p||0)*k,c:(f.c||0)*k,f:(f.f||0)*k}}
function sum(list){return list.reduce((a,e)=>{const n=nut(e);a.kcal+=n.kcal;a.p+=n.p;a.c+=n.c;a.f+=n.f;return a},{kcal:0,p:0,c:0,f:0})}
function macroGoals(){const s=db.settings;return{p:s.goal*s.macro.p/400,c:s.goal*s.macro.c/400,f:s.goal*s.macro.f/900}}
function amountLabel(e){return e.unit==='g'?`${r1(e.amount)} g`:`${r1(e.amount)} ${e.amount===1?'serving':'servings'}`}
const findEntry=id=>(db.log[cur]||[]).find(e=>e.id===id);

/* ---------- diary ---------- */
function macroBar(label,k,v,goal){
  const p=goal>0?Math.min(v/goal,1)*100:0;
  return `<div class="macro"><span class="m-lbl">${label}</span><div class="bar"><i class="m-${k}" style="width:${p}%"></i></div><span class="m-val">${r0(v)} / ${r0(goal)} g</span></div>`;
}
function renderDiary(){
  $('#dayLabel').textContent=dayLabel(cur);
  const list=db.log[cur]||[],t=sum(list),g=db.settings.goal,mg=macroGoals();
  const left=g-t.kcal,over=left<0,C=2*Math.PI*52,pct=g>0?Math.min(t.kcal/g,1):0;
  let h=`<section class="card summary">
    <div class="sum-side"><span class="num">${fmt(t.kcal)}</span><span class="lbl">Eaten</span></div>

  if(kcal==null||!name)return null;
  return{name,brand:(p.brands||'').split(',')[0].trim(),basis:'100g',servingG:num(p.serving_quantity)||null,

/* camera / photo helpers */
const loaded={};
function loadScript(src){
  if(!loaded[src])loaded[src]=new Promise((res,rej)=>{
    const s=document.createElement('script');s.src=src;s.async=true;
    s.onload=res;s.onerror=()=>{delete loaded[src];rej(new Error('load'))};
    document.head.appendChild(s);
  });
  return loaded[src];
}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
async function prepImage(file,{max=2000,gray=true}={}){
  const url=URL.createObjectURL(file);
  try{
    const img=await loadImg(url);
    // shrink big photos, enlarge small crops so small print is big enough to read
    let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(max/Math.max(w,h),Math.max(1,1600/Math.max(w,h)),3);
    w=Math.round(w*s);h=Math.round(h*s);
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;
    const ctx=cv.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,w,h);
    if(gray){
      const id=ctx.getImageData(0,0,w,h),d=id.data;let mn=255,mx=0;
      for(let i=0;i<d.length;i+=4){const y=.299*d[i]+.587*d[i+1]+.114*d[i+2];d[i]=y;if(y<mn)mn=y;if(y>mx)mx=y}
      const k=255/Math.max(mx-mn,1);
      for(let i=0;i<d.length;i+=4){const v=(d[i]-mn)*k;d[i]=d[i+1]=d[i+2]=v}
      ctx.putImageData(id,0,0);
    }
    return cv;
  }finally{URL.revokeObjectURL(url)}
}
function photoButtons(id){
  return `<div class="btnrow"><label class="btn primary">Take photo<input type="file" accept="image/*" capture="environment" id="${id}-cam" hidden></label><label class="btn">Photo library<input type="file" accept="image/*" id="${id}-lib" hidden></label></div>`;
}
function bindPhoto(id,fn){
  for(const s of['cam','lib'])$(`#${id}-${s}`).addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)fn(f)});
}

/* barcode */
let zxReader=null,stream=null,detLoop=null;
function setBc(msg,err){const s=$('#bcstatus');if(s){s.textContent=msg;s.classList.toggle('err',!!err)}}
function zxHints(){
  const h=new Map(),F=ZXing.BarcodeFormat;
  h.set(ZXing.DecodeHintType.TRY_HARDER,true);
  h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128]);
  return h;
}
function paneBarcode(){
  P().innerHTML=`<div class="card"><p class="hint">Point the camera at the barcode. Lookups use Open Food Facts, an open food database. Only the barcode number is sent.</p>
    <div class="scanbox" id="scanbox" hidden><video id="vid" playsinline muted></video><div class="reticle"></div></div>
    <div class="btnrow"><button class="btn primary" data-act="scanlive">Scan with camera</button><label class="btn">From a photo<input type="file" accept="image/*" id="bcfile" hidden></label></div>
    <p id="bcstatus" class="status"></p>
    <h3 class="sec">Or type the number</h3>
    <div class="searchrow"><input id="bcnum" inputmode="numeric" placeholder="4901234567890" aria-label="Barcode number"><button class="btn" data-act="bclookup">Look up</button></div></div>`;
  $('#bcfile').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)decodeBarcodeImage(f)});
}
function camErr(e){
  if(location.protocol==='file:')return'The live camera needs the app to be opened from an https address. Use “From a photo” instead.';
  if(e&&e.name==='NotAllowedError')return'Camera access is blocked. Allow it in your browser settings, or use “From a photo”.';
  return'Could not start the camera. Use “From a photo” instead.';
}
async function scanLive(){
  stopScan();
  $('#scanbox').hidden=false;setBc('Starting camera…');
  try{
    const v=$('#vid');
    if('BarcodeDetector' in window){
      const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      v.srcObject=stream;await v.play();setBc('Scanning…');
      const tick=async()=>{
        if(!stream)return;
        try{const r=await det.detect(v);if(r.length){const c=r[0].rawValue;stopScan();onBarcode(c);return}}catch(e){}
        detLoop=requestAnimationFrame(tick);
      };
      tick();return;
    }
    await loadScript(ZX_URL);
    zxReader=new ZXing.BrowserMultiFormatReader(zxHints());
    setBc('Scanning…');
    await zxReader.decodeFromConstraints({video:{facingMode:'environment'}},v,res=>{
      if(res&&zxReader){const c=res.getText();stopScan();onBarcode(c)}
    });
  }catch(e){stopScan();setBc(camErr(e),true)}
}
function stopScan(){
  if(detLoop)cancelAnimationFrame(detLoop);detLoop=null;
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  if(zxReader){try{zxReader.reset()}catch(e){}zxReader=null}
  const b=$('#scanbox');if(b)b.hidden=true;
}
async function decodeBarcodeImage(file){
  setBc('Reading barcode…');
  try{
    const cv=await prepImage(file,{max:1600,gray:false});
    if('BarcodeDetector' in window){
      try{const r=await new BarcodeDetector().detect(cv);if(r.length)return onBarcode(r[0].rawValue)}catch(e){}
    }
    await loadScript(ZX_URL);
    const res=await new ZXing.BrowserMultiFormatReader(zxHints()).decodeFromImageUrl(cv.toDataURL('image/jpeg',.92));
    onBarcode(res.getText());
  }catch(e){setBc('No barcode found in that photo. Try a closer, sharper shot, or type the number.',true)}
}
async function onBarcode(code){
  code=String(code||'').replace(/\D/g,'');
  if(code.length<6){setBc('Enter a full barcode number.',true);return}
  const mine=db.foods.find(f=>f.barcode===code);
  if(mine){toast('Found in My foods');openAmount(mine);return}
  setBc(`Looking up ${code}…`);
  try{
    const r=await fetch(`${OFF}/api/v2/product/${code}.json?fields=${OFF_FIELDS}`);
    const d=r.ok?await r.json():null;
    const f=d&&d.status===1?offToFood(d.product):null;
    if(f){f.barcode=code;openAmount(f,{isNew:true});return}
    sheet.pendingBarcode=code;sheet.view='label';renderSheet();
  }catch(e){setBc('Lookup failed. Check your connection and try again.',true)}
}

/* OCR (runs on this phone with Tesseract) */
let ocrW=null,ocrWLang='',ocrStatusEl=null;
async function ocr(canvas,st){
  ocrStatusEl=st;
  const lang=db.settings.ocrLang;
  if(!ocrW||ocrWLang!==lang){
    st.textContent='Loading the text reader. The first time, this downloads language data…';
    await loadScript(TESS_URL);
    if(ocrW){try{await ocrW.terminate()}catch(e){}ocrW=null}
    ocrW=await Tesseract.createWorker(lang.split('+'),1,{logger:m=>{
      if(!ocrStatusEl)return;
      if(m.status==='recognizing text')ocrStatusEl.textContent=`Reading text… ${Math.round((m.progress||0)*100)}%`;
    }});
    ocrWLang=lang;
    // mode 6 reads a table row by row (name and number on one line) instead of column by column
    await ocrW.setParameters({tessedit_pageseg_mode:'6',...(lang.includes('jpn')?{preserve_interword_spaces:'1'}:{})});
  }
  st.textContent='Reading text…';
  const{data}=await ocrW.recognize(canvas);
  st.textContent='';
  return data.text||'';
}
function ocrFail(st,e){
  st.classList.add('err');
  st.textContent=(e&&e.message==='load')?'The text reader could not load. It needs an internet connection the first time.':'Could not read that photo. Try again with better light.';
}
function normText(t){return String(t).replace(/[！-～]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/　/g,' ')}

/* Nutrient labels, tolerant of common OCR misreads. Labels mapped to null (saturated fat,
   sugars, fiber, salt...) are recognized so their numbers are not given to the wrong nutrient. */
const LABELS=[
  [null,/caloriesfromfat|fromfat|飽和脂肪酸|不飽和|トランス脂肪酸|saturated(?:fat)?|trans(?:fat)?|polyunsat\w*|monounsat\w*|コレステロール|cholesterol/g],
  [null,/食塩相当量|食塩|ナトリウム|sodium|salt|食物繊維|dietaryfib\w*|fib(?:er|re)|糖類|(?:total|added)?sugars?|カルシウム|calcium|鉄|iron|カリウム|potassium|ビタミン|vitamin\w*/g],
  ['kcal',/エネル(?:ギー?)?|ネルギー?|熱量|カロリー?|energy|calories|calorie/g],
  ['p',/たん[ぱば]く質?|タン[パバ]ク質?|蛋白質?|protein/g],
  ['f',/脂[質賀貿資]|lipids?|totalfat|fat/g],
  ['c',/炭水化物?|水化物|totalcarbohydrates?|carbohydrates?|carbs?/g],
  ['c2',/糖質/g]
];
function parseLabel(raw){
  const text=normText(raw).toLowerCase().replace(/(\d),(\d)/g,'$1.$2');
  const flat=text.replace(/\s+/g,'');
  const NUM=/(\d+(?:\.\d+)?)\s*(kcal|kca[l1i]|kj|mg|g|ml|%)?/g;
  const nums=s=>[...s.matchAll(NUM)].map(m=>({v:parseFloat(m[1]),u:(m[2]||'').replace(/^kca./,'kcal')})).filter(n=>n.u!=='%');
  const pick=(key,list)=>{
    if(!list.length)return null;
    if(key==='kcal'){
      const k=list.find(n=>n.u==='kcal');if(k)return k.v;
      const j=list.find(n=>n.u==='kj');if(j)return r0(j.v/4.184);
      return list[0].v;
    }
    const n=list[0];return n.u==='mg'?n.v/1000:n.v;
  };
  const out={},pending=[],column=[];
  const serveLine=/当たり|あたり|当り|per|serving|1(?:袋|個|本|食|枚|包装|パック|カップ|箱)|内容量|栄養成分/;
  for(const line of text.split('\n').map(l=>l.replace(/\s+/g,'')).filter(Boolean)){
    // every label on this line, earliest first, longer match wins on overlap
    let hits=[];
    for(const[key,re]of LABELS)for(const m of line.matchAll(re))hits.push({key,s:m.index,e:m.index+m[0].length});
    hits.sort((a,b)=>a.s-b.s||b.e-a.e);
    hits=hits.filter((h,i,a)=>!a.slice(0,i).some(x=>h.s<x.e));
    if(!hits.length){if(!serveLine.test(line))column.push(...nums(line));continue}
    hits.forEach((h,i)=>{
      const seg=line.slice(h.e,i+1<hits.length?hits[i+1].s:undefined);
      const v=pick(h.key,nums(seg));
      if(v==null)pending.push(h.key);
      else if(h.key&&out[h.key]==null)out[h.key]=v;
    });
  }
  // table read as columns: names first, numbers later. Pair them in order.
  pending.forEach((key,i)=>{if(key&&out[key]==null&&column[i])out[key]=pick(key,[column[i]])});
  const kcal=out.kcal??null,p=out.p??null,f=out.f??null,c=out.c??out.c2??null;
  const N='(\\d+(?:\\.\\d+)?)';
  let basis='serving',servingG=null;
  if(/100(g|ml)(当たり|あたり|当り)|per100(g|ml)|\(100(g|ml)\)|100(g|ml)中/.test(flat))basis='100g';
  else{
    const m=flat.match(new RegExp('(?:1(?:袋|個|本|食|枚|包装|パック|カップ|箱|切れ|杯|粒|缶|人前)|servingsize)[^0-9]{0,6}'+N+'(?:g|ml)'))
      ||flat.match(new RegExp(N+'(?:g|ml)\\)?(?:当たり|あたり|当り)'))
      ||flat.match(new RegExp('servingsize.{0,20}?\\('+N+'(?:g|ml)\\)'));
    if(m)servingG=parseFloat(m[1]);
  }
  return{basis,servingG,kcal,p,c,f};
}
function parseReceipt(raw){
  const out=[];
  const skip=/(合計|小計|税|釣|お預|預り|現金|クレジット|カード|ポイント|領収|レシート|電話|tel|no\.|total|subtotal|tax|change|cash|visa|master|card|thank|お買上|点数|値引|割引|登録|責任|〒|http|www|レジ|担当|取引|残高|支払|交通|電子マネー|paypay|suica|balance)/i;
  for(let line of normText(raw).split(/\n/)){
    line=line.trim();
    if(!line||skip.test(line))continue;
    if(/\d{2,4}\s*[\/年.\-]\s*\d{1,2}\s*[\/月.\-]\s*\d{1,2}/.test(line))continue;
    if(/\d{1,2}:\d{2}/.test(line))continue;
    if(/^\s*\d+\s*(個|点|コ)\s*[x×*]/i.test(line))continue;
    let name=line
      .replace(/[¥\\￥]\s*[\d,.]+.*$/,'')
      .replace(/\s*[\d,]+\s*(円|yen)?\s*[*※軽外内税]*\s*$/i,'')
      .replace(/^[\d\s*※#.\-]+/,'')
      .replace(/[*※]/g,'')
      .replace(/\s*[x×]\s*\d+\s*$/i,'')
      .replace(/\s{2,}/g,' ').trim();
    const letters=(name.match(/[A-Za-z぀-ヿ一-鿿]/g)||[]).length;
    if(letters<2)continue;
    if(name.length>40)name=name.slice(0,40);
    if(!out.includes(name))out.push(name);
  }
  return out.slice(0,40);
}

/* ---------- progress ---------- */
function renderProgress(){
  const g=db.settings.goal,days=[];
  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=dkey(d);days.push({k,kcal:sum(db.log[k]||[]).kcal,lbl:d.toLocaleDateString(undefined,{weekday:'short'})})}
  const logged=days.filter(d=>d.kcal>0);
  const avg=logged.length?logged.reduce((a,d)=>a+d.kcal,0)/logged.length:0;
  const W=320,H=160,L=36,B=22,T=10,R=6;
  const top=Math.ceil(Math.max(g*1.25,...days.map(d=>d.kcal))/500)*500;
  const y=v=>T+(H-T-B)*(1-v/top),bw=(W-L-R)/7;
  let bars=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Calories for the last 7 days">`;
  for(const t of[0,g,top]){if(t===g&&Math.abs(top-g)<top*.08)continue;bars+=`<text x="${L-6}" y="${y(t)+3}" text-anchor="end">${fmt(t)}</text>`}
  bars+=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>`;
  days.forEach((d,i)=>{
    const x=L+i*bw+bw*.2,w=bw*.6,hh=y(0)-y(d.kcal);
    bars+=`<rect x="${x.toFixed(1)}" y="${y(d.kcal).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(hh,0).toFixed(1)}" rx="3" fill="${d.kcal>g*1.05?'var(--warn)':'var(--accent)'}"/>`;
    bars+=`<text x="${(L+i*bw+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${esc(d.lbl)}</text>`;
  });
  bars+=`<line x1="${L}" x2="${W-R}" y1="${y(g)}" y2="${y(g)}" stroke="var(--muted)" stroke-dasharray="4 4"/></svg>`;

  const ws=db.weights.slice().sort((a,b)=>a.date<b.date?-1:1);
  let wchart='<p class="empty">Log your weight on two or more days to see a trend.</p>';
  if(ws.length>=2){
    const pts=ws.slice(-60),vals=pts.map(p=>p.kg);
    const lo=Math.floor(Math.min(...vals)-.5),hi=Math.ceil(Math.max(...vals)+.5);
    const wy=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
    const t0=fromKey(pts[0].date).getTime(),t1=fromKey(pts[pts.length-1].date).getTime();
    const wx=d=>L+(W-L-R-6)*(t1===t0?.5:(fromKey(d).getTime()-t0)/(t1-t0));
    const line=pts.map((p,i)=>`${i?'L':'M'}${wx(p.date).toFixed(1)},${wy(p.kg).toFixed(1)}`).join(' ');
    const last=pts[pts.length-1];
    const short=k=>fromKey(k).toLocaleDateString(undefined,{month:'short',day:'numeric'});
    wchart=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend">
      ${[lo,(lo+hi)/2,hi].map(v=>`<line x1="${L}" x2="${W-R}" y1="${wy(v)}" y2="${wy(v)}" stroke="var(--line)"/><text x="${L-6}" y="${wy(v)+3}" text-anchor="end">${r1(v)}</text>`).join('')}
      <path d="${line} L${wx(last.date).toFixed(1)},${wy(lo)} L${wx(pts[0].date).toFixed(1)},${wy(lo)} Z" fill="var(--accent-soft)" opacity=".7"/>
      <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${wx(last.date).toFixed(1)}" cy="${wy(last.kg).toFixed(1)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
      <text x="${L}" y="${H-6}">${short(pts[0].date)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${short(last.date)}</text></svg>`;
  }
  const lastW=ws[ws.length-1],firstW=ws[0];
  $('#view-progress').innerHTML=`
    <section class="card"><h2>Last 7 days</h2>
      <div class="kpis"><div class="kpi"><span class="num">${fmt(avg)}</span><span class="lbl">Daily average, logged days</span></div><div class="kpi"><span class="num">${logged.length}/7</span><span class="lbl">Days logged</span></div></div>
      ${bars}<p class="small">Dashed line is your ${fmt(g)} kcal goal.</p></section>
    <section class="card"><h2>Weight</h2>
      ${lastW?`<div class="kpis"><div class="kpi"><span class="num">${r1(lastW.kg)} kg</span><span class="lbl">Latest</span></div>${ws.length>1?`<div class="kpi"><span class="num">${(lastW.kg-firstW.kg>0?'+':'')+r1(lastW.kg-firstW.kg)} kg</span><span class="lbl">Since ${fromKey(firstW.date).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span></div>`:''}</div>`:''}
      ${wchart}
      <div class="row2" style="margin-top:12px"><label>Weight (kg)<input id="w-kg" type="number" inputmode="decimal" step="0.1" placeholder="${lastW?r1(lastW.kg):'70.0'}"></label><label>Date<input id="w-date" type="date" value="${dkey(new Date())}"></label></div>
      <button class="btn primary wide" style="margin-top:10px" data-act="wsave">Log weight</button>
      ${ws.length?`<ul class="wlist">${ws.slice(-5).reverse().map(w=>`<li><span>${fromKey(w.date).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}</span><span>${r1(w.kg)} kg <button class="iconbtn" data-act="wdel" data-id="${w.date}" aria-label="Delete">×</button></span></li>`).join('')}</ul>`:''}
    </section>`;
}

function calcGoal(p){
  const bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==='m'?5:-161);
  const tdee=bmr*p.activity,floor=p.sex==='m'?1500:1200,raw=tdee+Number(p.pace);
  return{tdee:Math.round(tdee/10)*10,goal:Math.max(floor,Math.round(raw/10)*10),floored:raw<floor};
}

async function exportData(){
  const name=`mycalorie-backup-${dkey(new Date())}.json`;
  const blob=new Blob([JSON.stringify(db)],{type:'application/json'});
  // iPhone: the share sheet can save to Files or AirDrop; a plain download often just opens a preview
  try{
    const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||typeof d!=='object'||!d.log||!d.settings)throw 0;
      if(!confirm('Replace all current data with this backup?'))return;
      localStorage.setItem(KEY,JSON.stringify(d));db=load();renderAll();toast('Backup restored');
    }catch(e){toast('That file is not a MyCalorie backup.')}
  };
  r.readAsText(file);
}

/* ---------- shell ---------- */
let curView='diary';
function showView(v){
  curView=v;
  for(const x of['diary','progress','settings'])$('#view-'+x).hidden=x!==v;
  document.querySelectorAll('.navtab').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $('#daynav').hidden=v!=='diary';
  $('#topTitle').textContent=v==='diary'?'MyCalorie':v==='progress'?'Progress':'Settings';
  if(v==='progress')renderProgress();
  if(v==='settings')renderSettings();
  if(v==='diary')renderDiary();
  window.scrollTo(0,0);
}
function renderAll(){renderDiary();if(curView!=='diary')showView(curView)}
let toastT;
function toast(msg,action){
  const t=$('#toast');
  t.innerHTML=`<span>${esc(msg)}</span>${action?`<button id="toastAct">${esc(action.label)}</button>`:''}`;
  t.hidden=false;
  if(action)$('#toastAct').onclick=()=>{action.fn();t.hidden=true};
  clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},action?5000:2200);
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id,i=+b.dataset.i;
  const R=sheet.receipt;
  switch(a){
    case'view':showView(b.dataset.v);break;
    case'prevday':shiftDay(-1);break;
    case'nextday':shiftDay(1);break;
    case'today':cur=dkey(new Date());renderDiary();break;
    case'add':openAdd(b.dataset.meal);break;
    case'edit':{const en=findEntry(id);if(en)openAdd(en.meal,'amount',{food:en.food,opts:{editId:id}});break}
    case'del':{
      const list=db.log[cur]||[],idx=list.findIndex(x=>x.id===id);if(idx<0)break;
      const[gone]=list.splice(idx,1);const day=cur;save();renderDiary();
      toast(`Removed ${gone.food.name}`,{label:'Undo',fn:()=>{(db.log[day]||(db.log[day]=[])).splice(idx,0,gone);save();renderDiary()}});
      break;
    }
    case'water':{const w=Math.min(30,Math.max(0,(db.water[cur]||0)+Number(b.dataset.d)));db.water[cur]=w;save();renderDiary();break}
    case'close':closeSheet();break;
    case'tab':stopScan();sheet.view=b.dataset.v;sheet.receiptIdx=null;if(b.dataset.v!=='label')sheet.pendingBarcode=null;renderSheet();break;
    case'online':searchOnline();break;
    case'pick':{const f=db.foods.find(x=>x.id===id);if(f)openAmount(f);break}
    case'pickOnline':{const f=(sheet.onlineResults||[])[+id];if(f)openAmount({...f},{isNew:true});break}
    case'lblPaste':{const t=$('#lbl-txt').value.trim();if(t)labelFromText(t);else{toast('Scan or paste the label text first.');$('#lbl-txt').focus()}break}
    case'rcPaste':{const t=$('#rc-txt').value.trim();if(t)receiptFromText(t);else{toast('Scan or paste the receipt text first.');$('#rc-txt').focus()}break}
    case'newfood':openForm({basis:'100g',barcode:sheet.pendingBarcode||null,name:sheet.receiptIdx!=null&&R?R.items[sheet.receiptIdx].name:''});break;
    case'setamt':$('#amt').value=b.dataset.v;$('#amt').dispatchEvent(new Event('input'));break;
    case'commit':commitAmount();break;
    case'editfood':openForm(sheet.food,{editFoodId:sheet.food.id});break;
    case'saveform':saveForm();break;
    case'scanlive':scanLive();break;
    case'bclookup':onBarcode($('#bcnum').value);break;
    case'rcmatch':{const m=matchFood(R.items[i].name);if(m){sheet.receiptIdx=i;openAmount(m)}break}
    case'rcfind':sheet.receiptIdx=i;sheet.q=R.items[i].name;sheet.onlineResults=null;sheet.view='search';renderSheet();break;
    case'rcskip':R.items.splice(i,1);renderReceipt();break;
    case'quickadd':quickAdd();break;
    case'wsave':{
      const kg=num($('#w-kg').value),date=$('#w-date').value||dkey(new Date());
      if(!(kg>20&&kg<400)){toast('Enter your weight in kg.');break}
      db.weights=db.weights.filter(w=>w.date!==date);db.weights.push({date,kg:r1(kg)});
      db.settings.profile.weight=r1(kg);save();renderProgress();toast('Weight logged');break;
    }
    case'wdel':db.weights=db.weights.filter(w=>w.date!==id);save();renderProgress();break;
    case'calcuse':db.settings.goal=calcGoal(db.settings.profile).goal;save();renderSettings();toast(`Goal set to ${fmt(db.settings.goal)} kcal`);break;
    case'fooddel':{
      const f=db.foods.find(x=>x.id===id);if(!f)break;
      db.foods=db.foods.filter(x=>x.id!==id);save();renderSettings();
      toast(`Deleted ${f.name}`,{label:'Undo',fn:()=>{db.foods.push(f);save();renderSettings()}});break;
    }
    case'export':exportData();break;
    case'delall':
      if(confirm('Delete every entry, food and setting on this phone? This cannot be undone.')){
        try{localStorage.removeItem(KEY)}catch(err){}db=blank();renderAll();toast('All data deleted');
      }
      break;
  }
});
$('#mealSel').addEventListener('change',e=>{
  sheet.meal=e.target.value;
  const btn=$('#commitBtn');if(btn&&!(sheet.opts&&sheet.opts.editId))btn.textContent='Add to '+mealName(sheet.meal);
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)stopScan();
  else if(curView==='diary'&&$('#sheet').hidden)renderDiary();
});

/* offline support: sw.js caches the app files (never your data); needs https */
if('serviceWorker' in navigator&&window.isSecureContext)
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
renderDiary();
</script>
